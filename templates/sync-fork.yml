# 将此文件复制到你的 fork 仓库的 .github/workflows/ 目录下
# 修改 UPSTREAM_REPO 和 TARGET_BRANCH 为你的实际值

name: Sync Fork from Upstream

on:
  schedule:
    # 每天 UTC 0:00 执行（北京时间 8:00）
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      sync_tags:
        description: 是否同步 tags
        type: boolean
        default: true
      sync_branches:
        description: 是否同步分支
        type: boolean
        default: false

env:
  UPSTREAM_REPO: spring-projects/spring-ai
  SYNC_TAGS: 'true'
  SYNC_BRANCHES: 'false'
  TARGET_BRANCH: 'main'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from upstream
        uses: SourceDive/sync-fork@v1
        with:
          upstream_repo: ${{ env.UPSTREAM_REPO || github.event.inputs.upstream_repo }}
          sync_tags: ${{ github.event.inputs.sync_tags || env.SYNC_TAGS || 'true' }}
          sync_branches: ${{ github.event.inputs.sync_branches || env.SYNC_BRANCHES || 'false' }}
          target_branch: ${{ env.TARGET_BRANCH || 'main' }}
